name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Create venv and install dev dependencies
        shell: bash
        run: |
          uv venv .venv --python 3.13
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            uv pip install --python .venv/Scripts/python.exe -r requirements-dev.txt
          else
            uv pip install --python .venv/bin/python -r requirements-dev.txt
          fi
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m pytest
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a .venv/bin/python -m pytest
      - name: Lint
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            .venv/Scripts/ruff.exe check .
          else
            .venv/bin/ruff check .
          fi

  build:
    name: bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Create venv and install build dependencies
        shell: bash
        run: |
          uv venv .venv --python 3.13
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            uv pip install --python .venv/Scripts/python.exe -r requirements-build.txt requests
          else
            uv pip install --python .venv/bin/python -r requirements-build.txt requests
          fi
      - name: Generate assets
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then .venv/Scripts/python.exe build/make_assets.py; else .venv/bin/python build/make_assets.py; fi
        shell: bash
      - name: Build Windows one-file executable
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m PyInstaller --clean --noconfirm build\kicad_lib_gen_gui.spec
      - name: Rename and self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (.venv\Scripts\python.exe -c "import version; print(version.__version__)").Trim()
          $artifact = "dist\KiCadLibGen-$version-win64.exe"
          Move-Item dist\KiCadLibGen.exe $artifact
          $process = Start-Process -FilePath $artifact -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Self-test failed" }
          $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $artifact)" | Set-Content -Encoding ascii "$artifact.sha256"
          Get-Item $artifact | Select-Object Name, Length
      - name: Build Windows one-dir fallback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (.venv\Scripts\python.exe -c "import version; print(version.__version__)").Trim()
          .venv\Scripts\python.exe -m PyInstaller --noconfirm --onedir --windowed `
            --workpath build-onedir --distpath dist-onedir --name KiCadLibGenDir `
            --add-data "assets;assets" --icon assets\app.ico `
            --version-file build\version_info.txt --exclude-module prompt_toolkit gui_main.py
          $zip = "dist\KiCadLibGen-$version-win64-onedir.zip"
          Compress-Archive -Path dist-onedir\KiCadLibGenDir -DestinationPath $zip -Force
          $process = Start-Process -FilePath "dist-onedir\KiCadLibGenDir\KiCadLibGenDir.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "One-dir self-test failed" }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -Encoding ascii "$zip.sha256"
          Get-Item $zip | Select-Object Name, Length
      - name: Build Linux one-file executable
        if: runner.os == 'Linux'
        run: .venv/bin/python -m PyInstaller --clean --noconfirm build/kicad_lib_gen_gui.spec
      - name: Package and self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          VERSION=$(.venv/bin/python -c "import version; print(version.__version__)")
          mv dist/KiCadLibGen "dist/kicad-lib-gen-$VERSION-linux-x86_64"
          chmod +x "dist/kicad-lib-gen-$VERSION-linux-x86_64"
          "dist/kicad-lib-gen-$VERSION-linux-x86_64" --self-test
          xvfb-run -a "dist/kicad-lib-gen-$VERSION-linux-x86_64" --smoke-test
          tar -C dist -czf "dist/kicad-lib-gen-$VERSION-linux-x86_64.tar.gz" "kicad-lib-gen-$VERSION-linux-x86_64"
          cd dist
          sha256sum "kicad-lib-gen-$VERSION-linux-x86_64.tar.gz" > "kicad-lib-gen-$VERSION-linux-x86_64.tar.gz.sha256"
          ls -lh
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-onefile
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-onefile
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List release files
        run: find artifacts -type f -maxdepth 3 -print
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-onefile/*.exe
            artifacts/windows-onefile/*.zip
            artifacts/windows-onefile/*.sha256
            artifacts/linux-onefile/*.tar.gz
            artifacts/linux-onefile/*.sha256
          body: |
            KiCad LibGen ${{ github.ref_name }}

            - Windows one-file executable (unsigned; SHA256 included)
            - Linux x86_64 one-file tarball (executable bit preserved)

            See README-GUI.md for first-run authentication and database notes.
